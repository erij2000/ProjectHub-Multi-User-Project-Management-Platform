<div class="login-container">
  <mat-card class="login-card">
    <div class="login-logo">
      <mat-icon>business_center</mat-icon>
      <h1>Gestion Projets</h1>
      <p>Connectez-vous à votre espace</p>
    </div>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="email@example.com">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email requis</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Email invalide</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">Mot de passe requis</mat-error>
        </mat-form-field>

        <div style="margin-top: 8px; margin-bottom: 16px; padding: 12px; background: #f0f4ff; border-radius: 8px; font-size: 13px; color: #555;">
          <strong>Admin :</strong> admin@test.com / admin123<br>
          <strong>Employé :</strong> jean@test.com / jean123
        </div>

        <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loading()">
          <mat-spinner diameter="20" *ngIf="loading()" style="display:inline-block; margin-right:8px;"></mat-spinner>
          {{ loading() ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
