<div class="page-header">
  <h2><mat-icon>category</mat-icon> Catégories</h2>
</div>

<div class="content-layout">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>{{ editing() ? 'Modifier' : 'Nouvelle catégorie' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Nom de la catégorie</mat-label>
          <input matInput formControlName="nom" placeholder="Ex: Ingénieur">
          <mat-icon matSuffix>label</mat-icon>
          <mat-error>Nom requis</mat-error>
        </mat-form-field>
        <div class="form-actions">
          <button mat-stroked-button type="button" *ngIf="editing()" (click)="cancel()">Annuler</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
            <mat-icon>{{ editing() ? 'save' : 'add' }}</mat-icon>
            {{ editing() ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card class="table-card">
    <mat-card-header>
      <mat-card-title>Liste des catégories ({{ categories().length }})</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="categories()">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let c">{{ c.id }}</td>
        </ng-container>
        <ng-container matColumnDef="nom">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let c"><mat-chip>{{ c.nom }}</mat-chip></td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let c">
            <button mat-icon-button color="primary" (click)="edit(c)" matTooltip="Modifier">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="delete(c.id!)" matTooltip="Supprimer">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
