<mat-sidenav-container style="height: 100vh;">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <mat-icon>business_center</mat-icon>
      <h3>Gestion Projets</h3>
      <p>{{ authService.currentUser()?.email }}</p>
    </div>
    <mat-nav-list>
      <a mat-list-item
         *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="active"
         class="nav-item">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
      <mat-divider style="border-color: rgba(255,255,255,0.2); margin: 8px 0;"></mat-divider>
      <a mat-list-item class="nav-item" (click)="authService.logout()" style="cursor:pointer;">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Déconnexion</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="main-toolbar">
      <span style="font-weight: 600; color: #3f51b5;">Administration</span>
      <span class="spacer"></span>
      <mat-chip class="chip-admin">ADMIN</mat-chip>
    </mat-toolbar>
    <div class="page-container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
