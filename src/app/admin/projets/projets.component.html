<div class="page-header">
  <h2><mat-icon>folder</mat-icon> Projets</h2>
</div>
<div class="content-layout">
  <mat-card class="form-card">
    <mat-card-header><mat-card-title>{{ editing() ? 'Modifier' : 'Nouveau projet' }}</mat-card-title></mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Nom du projet</mat-label>
          <input matInput formControlName="nom">
          <mat-icon matSuffix>folder</mat-icon>
          <mat-error>Requis</mat-error>
        </mat-form-field>
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3"></textarea>
        </mat-form-field>
        <div class="form-actions">
          <button mat-stroked-button type="button" *ngIf="editing()" (click)="cancel()">Annuler</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
            <mat-icon>{{ editing() ? 'save' : 'add' }}</mat-icon>
            {{ editing() ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card class="table-card">
    <mat-card-header><mat-card-title>Liste des projets ({{ projets().length }})</mat-card-title></mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="projets()">
        <ng-container matColumnDef="nom">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let p"><strong>{{ p.nom }}</strong></td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let p">{{ p.description || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let p">
            <button mat-icon-button color="primary" (click)="edit(p)"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(p.id!)"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
